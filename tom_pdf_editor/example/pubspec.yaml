name: tom_pdf_editor_example
description: >-
  The PDF editor in a window: opens a PDF with the real PDFium library from
  the binaries layer. Run with the PDF's path in TOM_PDF_FILE.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  tom_file_session:
    path: ../../tom_file_session
  tom_pdf_editor:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
