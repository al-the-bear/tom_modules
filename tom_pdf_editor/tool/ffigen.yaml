# FFIgen over the vendored PDFium headers (DPPF-1).
#   dart run ffigen --config tool/ffigen.yaml
# Only the functions the editor calls are bound, so the bindings stay small
# and reviewable. The library is opened at runtime from the path
# TomPdfiumLocator resolves, so the bindings are a class over a
# DynamicLibrary, not @Native declarations.
name: PdfiumBindings
description: Bindings to PDFium chromium/8152 (third_party/pdfium/include/).
output: ../lib/src/pdfium/pdfium_bindings.g.dart
headers:
  entry-points:
    - ../third_party/pdfium/include/fpdfview.h
    - ../third_party/pdfium/include/fpdf_doc.h
    - ../third_party/pdfium/include/fpdf_text.h
    - ../third_party/pdfium/include/fpdf_annot.h
    - ../third_party/pdfium/include/fpdf_save.h
    - ../third_party/pdfium/include/fpdf_formfill.h
  include-directives:
    - ../third_party/pdfium/include/*.h
functions:
  include:
    # Library
    - FPDF_InitLibraryWithConfig
    - FPDF_DestroyLibrary
    - FPDF_GetLastError
    # Document
    - FPDF_LoadDocument
    - FPDF_LoadMemDocument64
    - FPDF_CloseDocument
    - FPDF_GetPageCount
    - FPDF_GetPageSizeByIndexF
    - FPDF_GetDocPermissions
    - FPDF_GetSecurityHandlerRevision
    - FPDF_GetFileVersion
    - FPDF_GetFormType
    - FPDFBookmark_GetFirstChild
    - FPDFBookmark_GetNextSibling
    - FPDFBookmark_GetTitle
    - FPDFBookmark_GetDest
    - FPDFDest_GetDestPageIndex
    # Page
    - FPDF_LoadPage
    - FPDF_ClosePage
    - FPDFPage_GetRotation
    - FPDF_DeviceToPage
    - FPDF_PageToDevice
    - FPDF_GetPageWidthF
    - FPDF_GetPageHeightF
    # Rendering
    - FPDFBitmap_CreateEx
    - FPDFBitmap_FillRect
    - FPDFBitmap_Destroy
    - FPDF_RenderPageBitmapWithMatrix
    # Forms (display)
    - FPDFDOC_InitFormFillEnvironment
    - FPDFDOC_ExitFormFillEnvironment
    - FPDF_FFLDraw
    - FORM_OnAfterLoadPage
    - FORM_OnBeforeClosePage
    # Forms (filling)
    - FORM_OnLButtonDown
    - FORM_OnLButtonUp
    - FORM_OnChar
    - FORM_OnKeyDown
    - FORM_OnKeyUp
    - FORM_ForceToKillFocus
    - FORM_GetFocusedAnnot
    - FORM_SetFocusedAnnot
    - FORM_SelectAllText
    - FORM_ReplaceSelection
    - FORM_CanUndo
    - FORM_Undo
    - FORM_CanRedo
    - FORM_Redo
    - FPDFAnnot_GetFormFieldAtPoint
    - FPDFAnnot_GetFormFieldType
    - FPDFAnnot_GetFormFieldName
    - FPDFAnnot_GetFormFieldValue
    - FPDFAnnot_GetFormFieldFlags
    - FPDFAnnot_IsChecked
    # Text
    - FPDFText_LoadPage
    - FPDFText_ClosePage
    - FPDFText_CountChars
    - FPDFText_GetCharIndexAtPos
    - FPDFText_GetCharBox
    - FPDFText_CountRects
    - FPDFText_GetRect
    - FPDFText_GetText
    - FPDFText_GetUnicode
    # Search
    - FPDFText_FindStart
    - FPDFText_FindNext
    - FPDFText_FindPrev
    - FPDFText_GetSchResultIndex
    - FPDFText_GetSchCount
    - FPDFText_FindClose
    # Links
    - FPDFLink_GetLinkAtPoint
    - FPDFLink_GetAction
    - FPDFLink_GetDest
    - FPDFAction_GetType
    - FPDFAction_GetURIPath
    - FPDFAction_GetDest
    # Annotations
    - FPDFPage_GetAnnotCount
    - FPDFPage_GetAnnot
    - FPDFPage_GetAnnotIndex
    - FPDFPage_CloseAnnot
    - FPDFPage_CreateAnnot
    - FPDFPage_RemoveAnnot
    - FPDFAnnot_GetSubtype
    - FPDFAnnot_SetRect
    - FPDFAnnot_GetRect
    - FPDFAnnot_SetColor
    - FPDFAnnot_GetColor
    - FPDFAnnot_AppendAttachmentPoints
    - FPDFAnnot_SetAttachmentPoints
    - FPDFAnnot_CountAttachmentPoints
    - FPDFAnnot_GetAttachmentPoints
    - FPDFAnnot_AddInkStroke
    - FPDFAnnot_RemoveInkList
    - FPDFAnnot_GetInkListCount
    - FPDFAnnot_GetInkListPath
    - FPDFAnnot_SetStringValue
    - FPDFAnnot_GetStringValue
    - FPDFAnnot_SetFlags
    - FPDFAnnot_GetFlags
    - FPDFAnnot_SetBorder
    - FPDFAnnot_GetBorder
    - FPDFAnnot_SetAP
    # Saving
    - FPDF_SaveAsCopy
structs:
  include: ['FPDF_LIBRARY_CONFIG_', '_FS_MATRIX_', '_FS_RECTF_', 'FPDF_FILEWRITE_', '_FPDF_FORMFILLINFO', '_IPDF_JsPlatform', '_FPDF_SYSTEMTIME', '_FS_QUADPOINTSF', 'FS_POINTF_']
typedefs:
  include: ['FPDF_.*', 'FS_.*', 'FPDF_FILEWRITE', 'FPDF_FORMFILLINFO']
macros:
  include: ['FPDF_ERR_.*', 'FPDF_ANNOT', 'FPDF_ANNOT_TEXT', 'FPDF_ANNOT_HIGHLIGHT', 'FPDF_ANNOT_INK', 'FPDF_ANNOT_WIDGET', 'FPDF_FORMFIELD_.*', 'FPDF_FORMFLAG_READONLY', 'FPDF_ANNOT_FLAG_PRINT', 'FPDF_REMOVE_SECURITY', 'FPDF_ANNOT_APPEARANCEMODE_.*', 'FPDF_LCD_TEXT', 'FPDF_INCREMENTAL', 'FPDF_NO_INCREMENTAL', 'FPDF_MATCHCASE', 'FPDF_MATCHWHOLEWORD', 'FPDFBitmap_.*', 'PDFACTION_.*', 'FORMTYPE_.*', 'FPDF_REVERSE_BYTE_ORDER']
unnamed-enums:
  include: ['FPDFBitmap_.*']
preamble: |
  // Generated by FFIgen from PDFium chromium/8152's headers
  // (third_party/pdfium/include/, BSD-3-Clause). Do not edit:
  // regenerate with `dart run ffigen --config tool/ffigen.yaml`.
  // ignore_for_file: type=lint
