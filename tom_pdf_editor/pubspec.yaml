name: tom_pdf_editor
description: >-
  The PDF editor without an engine: a Flutter widget that shows a PDF an
  engine renders, its controller, the host interface both PDF views share,
  the engine's interface, and fakes for tests (testing.dart). The engines
  are packages of their own: tom_pdf_pdfium (PDFium over FFI) and
  tom_pdf_pdfjs (pdf.js in a webview). License: BSD-3-Clause.
version: 0.2.0
publish_to: none
repository: https://github.com/al-the-bear/tom_modules

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  # The annotation and form history; the dirty marker. By path,
  # as tom_file_session takes it (a path and a hosted source cannot mix).
  tom_undo:
    path: ../../basics/tom_undo
  # Shared utilities.
  tom_basics: ^3.3.0
  # Path arithmetic.
  path: ^1.9.0
  # Annotation ids (NM).
  uuid: ^4.5.0
  # The binary save rules (TomBinaryFiles) the host gives the editor.
  tom_file_session:
    path: ../tom_file_session
  # Notices and readable colours.
  tom_ui_support:
    path: ../tom_ui_support

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
