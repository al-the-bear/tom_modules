name: tom_ui_testing
description: >-
  Test support for Flutter applications' widget tests: a golden harness that
  loads real fonts and checks content, contrast and machine paths before
  comparing pixels, and a wait for a network-backed action (tester.pumpUntil).
  License: BSD-3-Clause.
version: 0.1.0
repository: https://github.com/al-the-bear/tom_modules

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  # The comparator, matchers and tester the harness builds on.
  flutter_test:
    sdk: flutter
  # Path arithmetic.
  path: ^1.9.0
  # The wait policy and the browser suite.
  tom_test_support:
    path: ../../basics/tom_test_support
  tom_ui_support:
    path: ../tom_ui_support

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
