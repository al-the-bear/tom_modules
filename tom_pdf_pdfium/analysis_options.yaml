include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # Generated by FFIgen from the PDFium headers.
    - lib/src/pdfium_bindings.g.dart
  errors:
    # Takes its sibling modules by relative path; not published.
    invalid_dependency: ignore

linter:
  rules:
    - unawaited_futures
