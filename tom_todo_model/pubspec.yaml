name: tom_todo_model
description: >-
  The Tom workspace's shared todo model (TomTodo: the todo schema's field set,
  statuses and priorities) and the *.todo.yaml file codec, which edits a todo
  file as splices into its own text.
version: 1.1.0
repository: https://github.com/al-the-bear/tom_modules
issue_tracker: https://github.com/al-the-bear/tom_modules/issues
topics:
  - todo
  - yaml

environment:
  sdk: ^3.10.4

dependencies:
  meta: ^1.16.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
