name: tom_office_editor
description: >-
  The office editor: a Flutter widget that shows and edits an office document
  served by the LibreOfficeKit helper (tom_office_host) over protocol 1, its
  controller and host interface; LibreOffice detection and the helper
  launcher (io.dart); a fake helper for tests (testing.dart).
  License: BSD-3-Clause.
version: 0.4.1
publish_to: none
repository: https://github.com/al-the-bear/tom_modules

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  # Path arithmetic (file names, bundle folders).
  path: ^1.9.0
  # SHA-256 (the detector's file checks).
  crypto: ^3.0.0
  # Shared utilities.
  tom_basics: ^3.3.0
  # The binary save rules (TomBinaryFiles) the host gives the editor.
  tom_file_session:
    path: ../tom_file_session
  # Protocol 1: the helper's messages and frame codec.
  tom_office_protocol:
    path: ../tom_office_protocol
  # Notices and readable colours.
  tom_ui_support:
    path: ../tom_ui_support
  # The webview of the ZetaOffice view (the workspace's fork, WKWebView on
  # macOS).
  flutter_inappwebview:
    path: ../../xternal/tom_flutter_inappwebview/flutter_inappwebview

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The in-memory file system the tests' host saves into.
  tom_file_system:
    path: ../../basics/tom_file_system
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The ZetaOffice view's host page and zetajs (MIT). ZetaOffice's own
    # files are downloaded at run time, never kept here.
    - assets/zetaoffice/
