# FFIgen over the vendored LibreOfficeKit headers (spike code).
#   dart run ffigen --config tool/spike/ffigen.yaml
# Structs, function-pointer typedefs and the enums only: the headers export
# no functions (lok_init_2 is static inline; the trampoline exports it).
name: LibreOfficeKitBindings
description: Bindings to the LibreOfficeKit headers of LibreOffice 26.8.3.1.
output: lok_bindings.g.dart
headers:
  entry-points:
    - ../../third_party/libreofficekit/LibreOfficeKit.h
    - ../../third_party/libreofficekit/LibreOfficeKitEnums.h
  include-directives:
    - ../../third_party/libreofficekit/*.h
compiler-opts:
  - -DLOK_USE_UNSTABLE_API
functions:
  include: []
structs:
  include: ['_LibreOffice.*']
typedefs:
  include: ['LibreOffice.*']
enums:
  include: ['LibreOffice.*']
unnamed-enums:
  include: []
macros:
  include: []
preamble: |
  // Generated by FFIgen from LibreOffice 26.8.3.1's LibreOfficeKit headers
  // (MPL-2.0, third_party/libreofficekit/). Spike code.
  // ignore_for_file: type=lint
