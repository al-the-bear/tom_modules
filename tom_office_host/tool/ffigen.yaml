# FFIgen over the vendored LibreOfficeKit headers.
#   dart run ffigen --config tool/ffigen.yaml
# Structs, function-pointer typedefs and the enums only: the headers export
# no functions (lok_init_2 is static inline; the C part exports it).
name: LibreOfficeKitBindings
description: Bindings to the LibreOfficeKit headers in third_party/libreofficekit/.
output: ../lib/src/lok/lok_bindings.g.dart
headers:
  entry-points:
    - ../third_party/libreofficekit/LibreOfficeKit.h
    - ../third_party/libreofficekit/LibreOfficeKitEnums.h
  include-directives:
    - ../third_party/libreofficekit/*.h
compiler-opts:
  - -DLOK_USE_UNSTABLE_API
functions:
  include: []
structs:
  include: ['_LibreOffice.*']
typedefs:
  include: ['LibreOffice.*']
enums:
  include: ['LibreOffice.*']
unnamed-enums:
  include: []
macros:
  include: []
preamble: |
  // Generated by FFIgen from the LibreOfficeKit headers in
  // third_party/libreofficekit/ (MPL-2.0; the release is named in SOURCE.md).
  // Regenerate with `dart run ffigen --config tool/ffigen.yaml`.
  // ignore_for_file: type=lint
