name: tom_office_host
description: >-
  The LibreOfficeKit helper process of the office editors: holds one office
  document open in LibreOfficeKit and serves the office editor over protocol 1
  (tom_office_protocol) on stdin and stdout.
version: 0.2.0
publish_to: none
repository: https://github.com/al-the-bear/tom_modules

environment:
  sdk: ^3.10.0

executables:
  tom_office_host: tom_office_host

dependencies:
  # The trampoline's build hook (the same set as tom_pqc).
  code_assets: ^2.2.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.6
  # The command line (arguments, --version, --help). Base-first: never
  # reimplement CLI plumbing locally. By path, as tom_dart_editor_bundler
  # takes it.
  tom_build_base:
    path: ../../basics/tom_build_base
  # Protocol 1: the messages and the frame codec, shared with the editor.
  tom_office_protocol:
    path: ../tom_office_protocol

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  test: ^1.25.6
