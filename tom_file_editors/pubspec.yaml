name: tom_file_editors
description: >-
  Byte-preserving file editors over a tom_file_session session: the host
  interface, the source editor, the text and .env editors, YAML and Markdown
  highlighting, the schema cache, and a Markdown renderer for reading files
  and short texts. License: BSD-3-Clause.
version: 0.2.0
repository: https://github.com/al-the-bear/tom_modules

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  # Highlighting fenced code.
  highlight: ^0.7.0
  # The schema a YAML file names, compiled once.
  json_schema: ^5.2.2
  # The Markdown AST the renderer draws.
  markdown: ^7.3.1
  # Path arithmetic.
  path: ^1.9.0
  # The protected-clipboard port and the shared utilities.
  tom_basics: ^3.3.0
  # The editing session every file editor edits one file through.
  tom_file_session:
    path: ../tom_file_session
  tom_ui_support:
    path: ../tom_ui_support
  # ForgeSessionFile and ForgeSessionFileFrame, re-exported.
  tom_file_session_ui:
    path: ../tom_file_session_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tom_file_system:
    path: ../../basics/tom_file_system

flutter:
  uses-material-design: true
