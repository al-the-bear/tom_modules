name: tom_ui_support
description: >-
  Small Flutter building blocks every Tom application uses: colours kept
  readable against their background (WCAG AA), the editing-surface marker that
  tells a host which text field its clipboard and text commands act on, the
  notice queue, and running a change after the frame being built. License:
  BSD-3-Clause.
version: 0.1.0
repository: https://github.com/al-the-bear/tom_modules

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
